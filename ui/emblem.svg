      <stop offset="0%" stop-color="#ff2233" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#b30015" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0002" stop-opacity="0"/>
