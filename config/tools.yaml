# Tool enable/disable + danger overrides + sandbox params.
# No code edits needed to gate tools. See docs/component-5 §5, §7.
#
# danger override: "read" | "action" | "destructive" (config beats code default)

tools:
  web_search:
    enabled: true
    danger: read
  web_extract:
    enabled: false          # needs crawl4ai (installs with `pip install -e .[tools]`)
    danger: read
  browser_start:
    enabled: true
    danger: action
  browser_execute:
    enabled: true
    danger: action
  browser_close:
    enabled: true
    danger: action
  sys_stats:
    enabled: true
    danger: read
  shell:
    enabled: true
    danger: destructive
    sandbox:
      deny_list: ["rm -rf", "mkfs", "sudo", "shutdown", "reboot", "curl|sh", "> /dev/sda", ":(){", "mkfs.", "rmdir /", "dd if="]
      workdir: ~/jarvishome
  file_read:
    enabled: true
    danger: read
    sandbox:
      root: ~/jarvishome
  file_write:
    enabled: true
    danger: action
    sandbox:
      root: ~/jarvishome
  file_list:
    enabled: true
    danger: read
    sandbox:
      root: ~/jarvishome
  memory_write:
    enabled: false
    danger: action
  memory_search:
    enabled: false
    danger: read
  remember:
    enabled: true
    danger: action
  search_memory:
    enabled: true
    danger: read
  set_preference:
    enabled: true
    danger: action
  forget_memory:
    enabled: true
    danger: destructive
  search_notes:
    enabled: true
    danger: read
  note_capture:
    enabled: true
    danger: action
  todo_add:
    enabled: true
    danger: action
  todo_list:
    enabled: true
    danger: read
  todo_done:
    enabled: true
    danger: action
  tts_trigger:
    enabled: false           # enabled once kokoro-onnx is installed (pip install kokoro-onnx)
    danger: action
  device_notify:
    enabled: true            # notify-send (laptop) + ntfy (android); set NTFY_TOPIC env var
    danger: action
  # screen control tools (Wayland: ydotool + XDG portal screenshots)
  screenshot:
    enabled: true
    danger: read
  screenshot_region:
    enabled: true
    danger: read
  screenshot_window:
    enabled: true
    danger: read
  mouse_click:
    enabled: true
    danger: action
  mouse_double_click:
    enabled: true
    danger: action
  mouse_move:
    enabled: true
    danger: action
  mouse_drag:
    enabled: true
    danger: action
  scroll:
    enabled: true
    danger: action
  type_text:
    enabled: true
    danger: destructive
  key_press:
    enabled: true
    danger: destructive
  key_combo:
    enabled: true
    danger: destructive
  window_list:
    enabled: true
    danger: read
  window_focus:
    enabled: true
    danger: action
  window_move:
    enabled: true
    danger: action
  window_resize:
    enabled: true
    danger: action
  window_close:
    enabled: true
    danger: action
  open_url:
    enabled: true
    danger: action
  open_app:
    enabled: true
    danger: action
  open_file:
    enabled: true
    danger: action
  clipboard_copy:
    enabled: true
    danger: action
  clipboard_paste:
    enabled: true
    danger: read
  screen_vision:
    enabled: true
    danger: read
  screen_find_and_click:
    enabled: true
    danger: action
  screen_type_and_submit:
    enabled: true
    danger: destructive
  screen_tab_and_type:
    enabled: true
    danger: destructive
  screen_uitars:
    enabled: true
    danger: destructive
  screen_compose_email:
    enabled: true
    danger: action
  screen_fill_form:
    enabled: true
    danger: action
  screen_navigate_and_act:
    enabled: true
    danger: action

sandbox:
  jail_root: ~/jarvishome
  max_output_chars: 8192
  shell_timeout_seconds: 60
  tool_timeout_seconds: 60
  thread_pool_size: 4
  retry_tools: ["web_search"]
  retry_count: 1
  retry_backoff_seconds: 2
