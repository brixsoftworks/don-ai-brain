# Model registry — the single source of truth for every model DON uses.
# All models run locally via Ollama. See docs/component-2-chat-models.md.
#
# keep_alive:  -1 = always resident; 300 = evict after 5 min idle.
# fallback:    ordered fallback chain on load failure (target -> ... -> router).

router:
  name: qwen2.5:3b-instruct-q4_K_M
  keep_alive: -1
  temperature: 0.0
  max_tokens: 2048
  fallback: []

main:
  name: qwen2.5:7b-instruct-q4_K_M
  keep_alive: -1
  temperature: 0.7
  max_tokens: 4096
  fallback: [router]

coder:
  name: qwen2.5-coder:7b-instruct-q4_K_M
  keep_alive: 300
  temperature: 0.2
  max_tokens: 8192
  fallback: [main, router]

reasoner:
  name: deepseek-r1:7b-instruct-q4_K_M
  keep_alive: 300
  temperature: 0.6
  max_tokens: 8192
  fallback: [main, router]

vision:
  name: qwen2.5vl:7b-instruct-q4_K_M
  keep_alive: 300
  temperature: 0.3
  max_tokens: 4096
  fallback: [main, router]

embeddings:
  name: qwen3-embedding:0.6b
  keep_alive: -1
  temperature: 0
  max_tokens: null
  fallback: [nomic-embed-text]

# task_type -> model department (docs/component-2 §4).
routing:
  quick_query: main
  system: main
  comms: main
  knowledge: main
  memory: main
  coding: coder
  debug: coder
  git: coder
  deploy: coder
  complex_plan: reasoner
  math: reasoner
  deep_analysis: reasoner
  summary: reasoner
  image_analysis: vision
  screen_capture: vision
  camera_view: vision
  unknown: main
